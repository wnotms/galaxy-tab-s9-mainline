name: Validate bring-up scripts

on:
  push:
    paths:
      - "kernel/patches/**"
      - "scripts/**"
      - "initramfs/**"
      - "Makefile"
      - ".github/workflows/validate-bringup.yml"
  pull_request:
    paths:
      - "kernel/patches/**"
      - "scripts/**"
      - "initramfs/**"
      - "Makefile"
      - ".github/workflows/validate-bringup.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate patch series
        run: python3 scripts/check-patch-series.py

      - name: Check Python syntax
        run: |
          python3 -m py_compile \
            scripts/twrp-entry-marker-test.py \
            scripts/check-patch-series.py \
            scripts/build-initramfs.py \
            scripts/build-boot-bundle.py \
            scripts/verify-boot-bundle.py

      - name: Check shell syntax
        run: |
          sh -n initramfs/init
          bash -n scripts/build-kernel.sh
          bash -n scripts/twrp-restore-original.sh
