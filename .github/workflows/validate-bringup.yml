name: Validate bring-up scripts

on:
  push:
    paths:
      - "kernel/patches/**"
      - "scripts/**"
      - "initramfs/**"
      - "Makefile"
      - ".github/workflows/validate-bringup.yml"
  pull_request:
    paths:
      - "kernel/patches/**"
      - "scripts/**"
      - "initramfs/**"
      - "Makefile"
      - ".github/workflows/validate-bringup.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run bring-up preflight
        run: python3 scripts/check-bringup.py
